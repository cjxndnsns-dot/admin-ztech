<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ZTECH KEY MANAGER</title><meta name="robots" content="noindex,nofollow"><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#05070b;color:#f5f7fb;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}.wrap{max-width:1000px;margin:auto;padding:28px 16px}.card{background:#0b0f16;border:1px solid #1b2432;border-radius:18px;padding:22px;box-shadow:0 20px 60px #0008}.hidden{display:none!important}.login{max-width:420px;margin:11vh auto}.brand{font-weight:900;letter-spacing:2px;font-size:24px;margin-bottom:6px}.muted{color:#8e9aaa;font-size:13px}.row{display:flex;gap:10px;flex-wrap:wrap}.field{margin-top:14px;flex:1;min-width:180px}label{display:block;font-size:12px;color:#9ca8b8;margin-bottom:7px}input{width:100%;background:#070a10;border:1px solid #263142;color:#fff;border-radius:10px;padding:12px;outline:none}input:focus{border-color:#6e7d92}button{border:0;border-radius:10px;padding:12px 16px;background:#fff;color:#05070b;font-weight:800;cursor:pointer}button.secondary{background:#151b25;color:#e9edf4;border:1px solid #263142}button.danger{background:#301217;color:#ffb7c0;border:1px solid #54202a}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.table{margin-top:18px;border:1px solid #1b2432;border-radius:12px;overflow:auto}.item{min-width:760px;display:grid;grid-template-columns:1.5fr 1fr .7fr .7fr .7fr;padding:13px 15px;border-bottom:1px solid #18202c;gap:12px;align-items:center}.item:last-child{border-bottom:0}.head{font-size:11px;color:#788598;text-transform:uppercase}.key{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:800;word-break:break-all}.badge{font-size:11px;padding:5px 8px;border-radius:999px;background:#14261a;color:#8fe0a4;display:inline-block}.empty{text-align:center;padding:50px 15px;color:#7f8a9b}.msg{min-height:20px;margin-top:12px;font-size:13px}.ok{color:#8fe0a4}.err{color:#ff9ba8}.tools{display:flex;gap:8px;flex-wrap:wrap}.small{font-size:12px}
</style></head><body><main class="wrap"><section id="login" class="card login"><div class="brand">ZTECH KEY MANAGER</div><div class="muted">Đăng nhập quản trị để tạo và quản lý key.</div><div class="field"><label>TÀI KHOẢN</label><input id="username" autocomplete="username" value=""></div><div class="field"><label>MẬT KHẨU</label><input id="password" type="password" autocomplete="current-password"></div><button id="loginBtn" style="width:100%;margin-top:16px">ĐĂNG NHẬP</button><div id="loginMsg" class="msg"></div></section>
<section id="app" class="hidden"><div class="top"><div><div class="brand">ZTECH KEY MANAGER</div><div class="muted">Danh sách key được lấy trực tiếp từ Firebase.</div></div><div class="tools"><button id="refresh" class="secondary">LÀM MỚI</button><button id="logout" class="danger">ĐĂNG XUẤT</button></div></div>
<div class="card"><div class="top"><div><b>TẠO KEY MỚI</b><div class="muted">Mặc định danh sách trống nếu Firebase chưa có key.</div></div><button id="create">TẠO KEY</button></div><div class="row"><div class="field"><label>TÊN KEY</label><input id="name" value="ZTECH"></div><div class="field"><label>THỜI HẠN (NGÀY) — 0 = VĨNH VIỄN</label><input id="days" type="number" min="0" max="3650" value="30"></div><div class="field"><label>GIỚI HẠN THIẾT BỊ — 0 = KHÔNG GIỚI HẠN</label><input id="limit" type="number" min="0" max="1000" value="1"></div></div><div id="createMsg" class="msg"></div></div>
<div class="card" style="margin-top:16px"><div class="top"><b>DANH SÁCH KEY</b><span id="count" class="muted">0 key</span></div><div id="table" class="table"><div class="empty">Chưa có key nào.</div></div></div></section></main><script src="/admin.js" defer></script></body></html>
